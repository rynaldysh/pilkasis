<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Riwayat Partisipasi (Akses Panitia)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4 flex justify-center">

    <!-- LAYAR LOGIN -->
    <div id="login-screen" class="flex flex-col items-center justify-center w-full max-w-sm mt-20">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full text-center border-t-8 border-gray-700">
            <h2 class="text-2xl font-extrabold mb-2 text-gray-800">Akses Terkunci</h2>
            <p class="text-gray-500 text-sm mb-6">Masukkan kata sandi panitia untuk melihat Riwayat Partisipasi.</p>
            <input type="password" id="password-input" class="shadow border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 mb-4 text-center" placeholder="Kata Sandi...">
            <button id="btn-login" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-lg w-full">Buka Data Riwayat</button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden font-semibold">Kata sandi salah!</p>
            <a href="index.html" class="block mt-6 text-gray-600 hover:text-gray-800 text-sm">&larr; Kembali ke Menu Utama</a>
        </div>
    </div>
    
    <!-- KONTEN UTAMA -->
    <div id="main-content" class="hidden w-full max-w-5xl flex-col">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full border-t-8 border-gray-700">
            <!-- Tombol Kembali Diubah Menjadi Keluar -->
            <button id="btn-keluar" class="text-blue-600 hover:text-blue-800 text-sm font-medium mb-4 flex items-center gap-1 cursor-pointer">
                <span>&larr;</span> Kembali & Keluar (Logout)
            </button>
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-800">Riwayat Partisipasi</h1>
                    <p class="text-gray-500 text-sm mt-1">Data pemilih yang <span class="font-bold text-emerald-600">SUDAH</span> menggunakan hak suaranya.</p>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                    <div class="w-full sm:w-48">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Filter Kelas:</label>
                        <select id="filterKelas" class="shadow border rounded w-full py-2 px-3 text-sm text-gray-700 cursor-pointer">
                            <option value="SEMUA">-- Semua Kelas --</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-56">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Cari Nama:</label>
                        <input type="text" id="cariNamaRiwayat" placeholder="🔍 Ketik nama..." class="shadow border rounded w-full py-2 px-3 text-sm text-gray-700">
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto rounded-lg border border-gray-200">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-700 text-white">
                        <tr>
                            <th class="py-3 px-6 text-left text-xs font-bold uppercase tracking-wider">No</th>
                            <th class="py-3 px-6 text-left text-xs font-bold uppercase tracking-wider">Nama Siswa / DPT</th>
                            <th class="py-3 px-6 text-left text-xs font-bold uppercase tracking-wider">Kelas</th>
                            <th class="py-3 px-6 text-left text-xs font-bold uppercase tracking-wider">Waktu Pemilihan</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body" class="text-gray-700 text-sm font-light divide-y divide-gray-200">
                        <tr><td colspan="4" class="py-4 text-center text-gray-500 italic">Memuat data partisipasi...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'
        
        const url_anda = 'https://oyiglseqiakqxlfzyiyk.supabase.co'
        const key_anda = 'sb_publishable_ceJ4y5UKhnPPuKBLNrzOxQ_2fMCXD_3' 
        const supabase = createClient(url_anda, key_anda)

        // Login System & Logout Otomatis
        const passBenar = "pilkasis2026";
        document.getElementById('btn-login').addEventListener('click', () => {
            if (document.getElementById('password-input').value === passBenar) {
                sessionStorage.setItem('authRiwayat', 'true'); mulaiSistem();
            } else { document.getElementById('error-msg').classList.remove('hidden'); }
        });

        if (sessionStorage.getItem('authRiwayat') === 'true') mulaiSistem();

        // Hapus session jika diklik kembali
        document.getElementById('btn-keluar').addEventListener('click', () => {
            sessionStorage.removeItem('authRiwayat');
            window.location.href = 'index.html'; 
        });

        // Hapus session otomatis jika ditinggalkan
        window.addEventListener('beforeunload', () => {
            sessionStorage.removeItem('authRiwayat');
        });

        function mulaiSistem() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('main-content').classList.add('flex');
            loadFilterKelasDinamic();
            fetchRiwayat();
            supabase.channel('skema-dpt').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'dpt_pemilih' }, () => { fetchRiwayat(); }).subscribe();
        }

        let dataRiwayat = [];

        async function loadFilterKelasDinamic() {
            const dropdown = document.getElementById('filterKelas');
            let { data, error } = await supabase.from('dpt_pemilih').select('kelas').limit(2000);
            if (error) return;
            const kelasUnik = [...new Set(data.map(item => item.kelas))].sort();
            dropdown.innerHTML = `<option value="SEMUA">-- Semua Kelas --</option>`;
            kelasUnik.forEach(k => { if(k) dropdown.innerHTML += `<option value="${k}">${k}</option>`; });
        }

        async function fetchRiwayat() {
            let { data, error } = await supabase
                .from('dpt_pemilih')
                .select('nama_lengkap, kelas, waktu_vote')
                .eq('status_vote', true)
                .order('waktu_vote', { ascending: false })
                .limit(2000);
            
            if (error) return;
            dataRiwayat = data;
            renderTabel(); 
        }

        function renderTabel() {
            const filterKelas = document.getElementById('filterKelas').value;
            const keywordNama = document.getElementById('cariNamaRiwayat').value.toLowerCase();
            const tbody = document.getElementById('tabel-body');
            tbody.innerHTML = '';

            let dataFiltered = filterKelas === "SEMUA" ? dataRiwayat : dataRiwayat.filter(item => item.kelas === filterKelas);
            if (keywordNama !== "") dataFiltered = dataFiltered.filter(item => item.nama_lengkap.toLowerCase().includes(keywordNama));
            if (dataFiltered.length === 0) return tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-gray-500 font-medium">Data pemilih tidak ditemukan.</td></tr>`;

            dataFiltered.forEach((row, index) => {
                const formatWaktu = new Date(row.waktu_vote).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB, ' + new Date(row.waktu_vote).toLocaleDateString('id-ID');
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition duration-150">
                        <td class="py-3 px-6 whitespace-nowrap font-medium text-gray-900">${index + 1}</td>
                        <td class="py-3 px-6 whitespace-nowrap font-bold text-gray-800">${row.nama_lengkap}</td>
                        <td class="py-3 px-6 whitespace-nowrap"><span class="bg-blue-100 text-blue-800 py-1 px-3 rounded-full text-xs font-bold border border-blue-200">${row.kelas}</span></td>
                        <td class="py-3 px-6 whitespace-nowrap text-gray-500 text-xs font-mono">${formatWaktu}</td>
                    </tr>`;
            });
        }

        document.getElementById('filterKelas').addEventListener('change', renderTabel);
        document.getElementById('cariNamaRiwayat').addEventListener('input', renderTabel);
    </script>
</body>
</html>
