<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilik Suara - E-Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10 px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-8 border-blue-600">
        
        <a href="index.html" class="text-blue-600 hover:text-blue-800 text-sm font-medium mb-6 inline-block transition-colors">&larr; Kembali ke Menu Utama</a>

        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Formulir Pemilihan</h1>
        
        <div class="mb-8 bg-blue-50 p-5 rounded-xl border border-blue-100 shadow-sm">
            <h2 class="text-sm font-bold text-blue-800 mb-4 uppercase tracking-wider border-b border-blue-200 pb-2">Verifikasi Data DPT</h2>
            
            <!-- 1. Dropdown Kelas -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="kelasSelect">1. Pilih Kelas Anda</label>
                <select class="shadow border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer" id="kelasSelect">
                    <option value="">-- Memuat Daftar Kelas... --</option>
                </select>
            </div>

            <!-- 2. Area Pilih Nama & Pencarian -->
            <div class="mb-2">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="namaSelect">2. Cari & Pilih Nama Anda</label>
                
                <!-- KOTAK PENCARIAN (Sembunyi sebelum kelas dipilih) -->
                <input type="text" id="cariNama" placeholder="🔍 Ketik nama untuk mencari..." class="shadow border border-gray-300 rounded-lg w-full py-2 px-3 text-gray-700 mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500 hidden transition-all">
                
                <select class="shadow border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100 cursor-not-allowed" id="namaSelect" disabled>
                    <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                </select>
                <p class="text-xs text-gray-500 mt-2 italic">*Nama yang sudah memilih otomatis hilang dari daftar.</p>
            </div>
        </div>

        <h2 class="text-sm font-bold text-gray-800 mb-4 uppercase tracking-wider text-center border-b pb-2">Kertas Suara</h2>
        <div id="tombol-container" class="flex flex-col gap-3">
            <p class="text-gray-500 text-center text-sm animate-pulse">Memuat data kandidat...</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'
        
        // --- MASUKKAN KREDENSIAL SUPABASE ANDA ---
        const url_anda = 'https://oyiglseqiakqxlfzyiyk.supabase.co'
        const key_anda = 'sb_publishable_ceJ4y5UKhnPPuKBLNrzOxQ_2fMCXD_3' 
        const supabase = createClient(url_anda, key_anda)

        // Variabel untuk menyimpan data nama siswa secara sementara (untuk fitur pencarian)
        let siswaDiKelasIni = [];

        async function loadKelasDinamic() {
            const dropdown = document.getElementById('kelasSelect');
            let { data, error } = await supabase.from('dpt_pemilih').select('kelas').limit(2000);
            
            if (error) return dropdown.innerHTML = `<option value="">Gagal memuat kelas</option>`;

            const kelasUnik = [...new Set(data.map(item => item.kelas))].sort();
            dropdown.innerHTML = `<option value="">-- Pilih Kelas Anda --</option>`;
            kelasUnik.forEach(k => {
                if (k) {
                    let option = document.createElement('option'); option.value = k; option.innerText = k;
                    dropdown.appendChild(option);
                }
            });
        }

        // FUNGSI RENDER NAMA KE DALAM DROPDOWN
        function renderDropdownNama(dataSiswa) {
            const namaSelect = document.getElementById('namaSelect');
            namaSelect.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
            
            if (dataSiswa.length === 0) {
                namaSelect.innerHTML = '<option value="">❌ Nama tidak ditemukan / Sudah memilih</option>';
                return;
            }

            dataSiswa.forEach(siswa => {
                let option = document.createElement('option');
                option.value = siswa.id; option.innerText = siswa.nama_lengkap;
                namaSelect.appendChild(option);
            });
            namaSelect.disabled = false;
            namaSelect.classList.remove('bg-gray-100', 'cursor-not-allowed');
            namaSelect.classList.add('bg-white', 'cursor-pointer');
        }

        // KETIKA KELAS DIPILIH
        document.getElementById('kelasSelect').addEventListener('change', async (e) => {
            const kelasTerpilih = e.target.value;
            const namaSelect = document.getElementById('namaSelect');
            const cariInput = document.getElementById('cariNama');

            if (!kelasTerpilih) {
                namaSelect.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
                namaSelect.disabled = true; namaSelect.classList.add('bg-gray-100', 'cursor-not-allowed');
                cariInput.classList.add('hidden'); cariInput.value = ''; // Sembunyikan pencarian
                return;
            }

            namaSelect.innerHTML = '<option value="">-- Sedang Memuat Nama... --</option>';
            namaSelect.disabled = true;

            let { data, error } = await supabase
                .from('dpt_pemilih')
                .select('id, nama_lengkap')
                .eq('kelas', kelasTerpilih)
                .eq('status_vote', false)
                .order('nama_lengkap', { ascending: true })
                .limit(2000);

            if (error) return namaSelect.innerHTML = `<option value="">Error memuat nama</option>`;

            if (data.length === 0) {
                namaSelect.innerHTML = '<option value="">✅ Semua DPT di kelas ini sudah memilih</option>';
                cariInput.classList.add('hidden');
                return;
            }

            // Simpan data asli, tampilkan form pencarian, dan render dropdown
            siswaDiKelasIni = data;
            cariInput.classList.remove('hidden');
            cariInput.value = '';
            renderDropdownNama(siswaDiKelasIni);
        });

        // KETIKA NAMA DIKETIK DI KOTAK PENCARIAN (REAL-TIME FILTER)
        document.getElementById('cariNama').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            // Saring data berdasarkan huruf yang diketik
            const dataDisaring = siswaDiKelasIni.filter(siswa => 
                siswa.nama_lengkap.toLowerCase().includes(keyword)
            );
            renderDropdownNama(dataDisaring);
        });

        async function loadKandidat() {
            const container = document.getElementById('tombol-container')
            let { data, error } = await supabase.from('poling').select('*').order('id', { ascending: true })

            if (error) return container.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;

            container.innerHTML = ''; 
            data.forEach(k => {
                let btn = document.createElement('button')
                btn.className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md w-full transition duration-300 transform hover:-translate-y-1'
                btn.innerText = `Pilih ${k.pilihan}`
                
                btn.onclick = async () => {
                    const kelasTerpilih = document.getElementById('kelasSelect').value;
                    const dptIdTerpilih = document.getElementById('namaSelect').value;

                    if (!kelasTerpilih) return alert("Peringatan: Silakan pilih Kelas Anda terlebih dahulu!");
                    if (!dptIdTerpilih) return alert("Peringatan: Silakan pilih Nama Anda dari daftar!");

                    const namaTeks = document.getElementById('namaSelect').options[document.getElementById('namaSelect').selectedIndex].text;
                    const yakin = confirm(`Apakah Anda yakin memilih menggunakan nama "${namaTeks}"?`);
                    if (!yakin) return;

                    btn.innerText = "Memproses..."; btn.disabled = true;

                    const waktuSekarang = new Date().toISOString();
                    const { data: updateData, error: updateDptError } = await supabase
                        .from('dpt_pemilih')
                        .update({ status_vote: true, kandidat_id: k.id, waktu_vote: waktuSekarang })
                        .eq('id', dptIdTerpilih)
                        .eq('status_vote', false)
                        .select();

                    if (updateDptError || updateData.length === 0) {
                        alert("GAGAL: Nama ini baru saja digunakan. Daftar nama akan diperbarui.");
                        document.getElementById('kelasSelect').dispatchEvent(new Event('change'));
                        btn.innerText = `Pilih ${k.pilihan}`; btn.disabled = false;
                        return;
                    }

                    const { error: errVote } = await supabase.from('poling').update({ jumlah_suara: k.jumlah_suara + 1 }).eq('id', k.id);
                    
                    if (!errVote) {
                        alert(`Terima kasih! Suara Anda berhasil dimasukkan.`);
                        document.getElementById('kelasSelect').value = '';
                        document.getElementById('namaSelect').innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
                        document.getElementById('namaSelect').disabled = true;
                        document.getElementById('cariNama').classList.add('hidden');
                        document.getElementById('cariNama').value = '';
                    }
                    
                    btn.innerText = `Pilih ${k.pilihan}`; btn.disabled = false;
                    loadKandidat();
                }
                container.appendChild(btn)
            })
        }

        loadKelasDinamic();
        loadKandidat();
    </script>
</body>
</html>
