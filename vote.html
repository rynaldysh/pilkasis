<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Poling</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
      <h1 class="text-2xl font-bold mb-6 text-gray-800">
        Silakan Pilih Kandidat
      </h1>
      <div id="tombol-container" class="flex flex-col gap-4"></div>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js";

      // Ganti dengan URL dan ANON KEY dari Supabase Anda
      const supabase = createClient("URL_SUPABASE", "ANON_KEY");

      async function loadKandidat() {
        let { data } = await supabase
          .from("poling")
          .select("*")
          .order("id", { ascending: true });
        const container = document.getElementById("tombol-container");
        container.innerHTML = "";

        data.forEach((k) => {
          let btn = document.createElement("button");
          btn.className =
            "bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-200 ease-in-out transform hover:scale-105";
          btn.innerText = `Vote ${k.pilihan}`;
          btn.onclick = () => kirimVote(k.id, k.jumlah_suara);
          container.appendChild(btn);
        });
      }

      async function kirimVote(id, currentVote) {
        // Melakukan update nilai jumlah_suara + 1 ke database
        await supabase
          .from("poling")
          .update({ jumlah_suara: currentVote + 1 })
          .eq("id", id);
        alert("Terima kasih sudah memilih!");
        loadKandidat();
      }

      loadKandidat();
    </script>
  </body>
</html>
