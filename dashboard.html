<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Count Dashboard (Akses Panitia)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- LAYAR LOGIN (Tampil pertama kali) -->
    <div id="login-screen" class="flex flex-col items-center justify-center w-full max-w-sm mt-20">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full text-center border-t-8 border-emerald-500">
            <h2 class="text-2xl font-extrabold mb-2 text-gray-800">Akses Terkunci</h2>
            <p class="text-gray-500 text-sm mb-6">Masukkan kata sandi panitia untuk melihat Live Count.</p>
            
            <input type="password" id="password-input" class="shadow border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center" placeholder="Kata Sandi...">
            
            <button id="btn-login" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg w-full transition duration-300">Buka Dashboard</button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden font-semibold">Kata sandi salah!</p>
            
            <a href="index.html" class="block mt-6 text-emerald-600 hover:text-emerald-800 text-sm">&larr; Kembali ke Menu Utama</a>
        </div>
    </div>

    <!-- KONTEN UTAMA (Disembunyikan sampai login berhasil) -->
    <div id="main-content" class="hidden w-full max-w-4xl flex-col items-center">
        <div class="w-full mb-4">
            <a href="index.html" class="text-blue-600 hover:text-blue-800 flex items-center gap-1 font-medium transition">
                <span>&larr;</span> Kembali ke Menu Utama
            </a>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-xl w-full">
            <h1 class="text-3xl font-extrabold mb-2 text-center text-gray-800">📊 Hasil Live Count</h1>
            <p class="text-center text-gray-500 mb-8">Visualisasi Persentase Suara Real-time</p>
            
            <div class="w-full mb-10 flex justify-center h-[400px]">
                <canvas id="polingChart"></canvas>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h2 class="text-xl font-bold mb-4 text-gray-700">Rincian Perolehan:</h2>
                <div id="display-realtime" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <p class="text-gray-400 italic">Menyambungkan ke database...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'
        
        // --- MASUKKAN KREDENSIAL SUPABASE ANDA ---
        const url_anda = 'https://oyiglseqiakqxlfzyiyk.supabase.co'
        const key_anda = 'sb_publishable_ceJ4y5UKhnPPuKBLNrzOxQ_2fMCXD_3' 
        const supabase = createClient(url_anda, key_anda)

        Chart.register(ChartDataLabels);
        let chartInstance = null;

        // --- SISTEM LOGIN ---
        const passBenar = "pilkasis2026";
        
        document.getElementById('btn-login').addEventListener('click', () => {
            const input = document.getElementById('password-input').value;
            if (input === passBenar) {
                sessionStorage.setItem('authDashboard', 'true');
                mulaiSistem();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        // Cek jika sudah login sebelumnya (saat di-refresh)
        if (sessionStorage.getItem('authDashboard') === 'true') {
            mulaiSistem();
        }

        // Fungsi ini hanya berjalan jika login berhasil
        function mulaiSistem() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('main-content').classList.add('flex');
            
            renderData();

            supabase.channel('skema-poling')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'poling' }, () => {
                renderData() 
            }).subscribe()
        }

        // --- FUNGSI GRAFIK (Sama seperti sebelumnya) ---
        function updateChart(namaKandidat, jumlahSuara, totalSeluruhSuara) {
            const ctx = document.getElementById('polingChart').getContext('2d');
            const backgroundColors = ['rgba(59, 130, 246, 0.85)', 'rgba(16, 185, 129, 0.85)', 'rgba(245, 158, 11, 0.85)'];

            if (!chartInstance) {
                chartInstance = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: namaKandidat,
                        datasets: [{
                            data: jumlahSuara,
                            backgroundColor: backgroundColors,
                            borderWidth: 2,
                            borderColor: '#ffffff',
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        animation: { animateRotate: true, animateScale: true, duration: 800, easing: 'easeOutQuart' },
                        plugins: {
                            legend: { position: 'bottom', labels: { padding: 20, font: { size: 14, weight: 'bold' } } },
                            datalabels: {
                                color: '#ffffff', font: { weight: 'bold', size: 16 },
                                formatter: (value) => {
                                    if (totalSeluruhSuara === 0) return '0%';
                                    return (value / totalSeluruhSuara * 100).toFixed(1) + "%";
                                }
                            }
                        }
                    }
                });
            } else {
                chartInstance.data.labels = namaKandidat;
                chartInstance.data.datasets[0].data = jumlahSuara;
                chartInstance.update();
            }
        }

        async function renderData() {
            let { data, error } = await supabase.from('poling').select('*').order('id', { ascending: true })
            const out = document.getElementById('display-realtime')
            
            if(error) return out.innerHTML = `<p class="text-red-500 col-span-3">Gagal mengambil data: ${error.message}</p>`;

            const namaKandidat = [], jumlahSuara = [];
            let totalSeluruhSuara = 0;
            data.forEach(k => { totalSeluruhSuara += k.jumlah_suara; });

            out.innerHTML = data.map(k => {
                namaKandidat.push(k.pilihan); jumlahSuara.push(k.jumlah_suara);
                let persentase = totalSeluruhSuara === 0 ? "0.0" : ((k.jumlah_suara / totalSeluruhSuara) * 100).toFixed(1);

                return `
                    <div class="flex flex-col items-center bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm transition-all transform hover:-translate-y-1">
                        <span class="text-lg font-bold text-gray-700 text-center mb-1">${k.pilihan}</span>
                        <div class="flex items-baseline gap-2 my-2">
                            <span class="text-3xl font-extrabold text-blue-600">${k.jumlah_suara}</span>
                            <span class="text-sm font-medium text-gray-500">Suara</span>
                        </div>
                        <div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">${persentase}% dari total</div>
                    </div>`
            }).join('')

            updateChart(namaKandidat, jumlahSuara, totalSeluruhSuara);
        }
    </script>
</body>
</html>
